name: cambotix-zebra
services:
  postgres:
    image: postgres:17.6-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: zebra
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/setup.py}
      POSTGRES_DB: zebra
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U zebra -d zebra']
      interval: 5s
      timeout: 3s
      retries: 20
  n8n:
    image: docker.n8n.io/n8nio/n8n@sha256:a42a47a6782f9d4419d81366199fa592e063ad41511cc80a0cd756252187c291
    restart: unless-stopped
    ports:
      - '127.0.0.1:${N8N_PORT:-5680}:5678'
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: zebra
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?Run scripts/setup.py}
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      N8N_EDITOR_BASE_URL: http://localhost:${N8N_PORT:-5680}
      WEBHOOK_URL: ${PUBLIC_WEBHOOK_URL:-http://localhost:8787/}
      GENERIC_TIMEZONE: Asia/Phnom_Penh
      TZ: Asia/Phnom_Penh
      N8N_SECURE_COOKIE: 'false'
      N8N_DIAGNOSTICS_ENABLED: 'false'
      N8N_PERSONALIZATION_ENABLED: 'false'
      N8N_VERSION_NOTIFICATIONS_ENABLED: 'false'
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: none
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_PRUNE: 'true'
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n_data:/home/node/.n8n
      - ./.local/import:/imports:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:5678/healthz").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))']
      interval: 10s
      timeout: 5s
      retries: 30
  ollama:
    image: ollama/ollama:0.33.3
    profiles: [docker-ai]
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1
    volumes:
      - ollama_data:/root/.ollama
  analyzer:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_NAME: zebra
      DB_USER: zebra
    ports:
      - '127.0.0.1:${ANALYZER_PORT:-8010}:8000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, python, -c, 'import urllib.request; urllib.request.urlopen("http://localhost:8000/health")']
      interval: 10s
      timeout: 3s
      retries: 20
  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8787}:8080'
    volumes:
      - ./.local/gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      n8n:
        condition: service_healthy
        restart: true
volumes:
  postgres_data:
  n8n_data:
  ollama_data:
